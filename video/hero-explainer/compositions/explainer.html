  <script>
    const tl = gsap.timeline({ paused: true });
    const E_IN = "expo.out", MOVE = "power3.inOut";

    // Caption: the words blur in one after another; out: the whole line blurs away.
    const capIn = (id, t) => {
      tl.to(id, { opacity: 1, duration: 0.01 }, t);
      tl.to(`${id} .w`, { opacity: 1, filter: "blur(0px)", duration: 0.2, stagger: 0.07, ease: "power4.out" }, t);

    const hide = (id, t, d = 0.22) => tl.to(id, { opacity: 0, duration: d, ease: "power2.in" }, t);
    // Typing: the text is uncovered one character per step.
    const type = (id, t, chars, cps = 18) => tl.to(id, { clipPath: "inset(0 0% 0 0)", duration: chars / cps, ease: `steps(${chars})` }, t);
    // A plugin is made beside the agent's bubble, then snaps into its slot in the running app.
    const build = (id, t, dx) => {
      tl.fromTo(id, { opacity: 0, scale: 0.3, x: dx, y: -270 }, { opacity: 1, scale: 0.55, duration: 0.35, ease: E_IN, immediateRender: false }, t);
      tl.to(id, { x: 0, y: 0, scale: 1, duration: 0.6, ease: MOVE }, t + 0.4);
      tl.to(id, { scale: 1.08, duration: 0.1, ease: "power2.out" }, t + 1.0);
      tl.to(id, { scale: 1, duration: 0.3, ease: "back.out(2.5)" }, t + 1.1);
    };

    // A1 0-4.5: a blank app
    show("#eb1", 0.2);
    capIn("#c1", 0.4);
    show("#k1", 0.3, 0.25); type("#k1t", 0.55, 20);
    show("#dotOn", 2.1, 0.2); show("#runA", 2.1);
    show("#ph", 2.3); show("#empty", 2.3); tl.to(["#sl1", "#sl2", "#sl3"], { opacity: 1, duration: 0.3, stagger: 0.08 }, 2.5);
    capOut("#c1", 4.0); hide("#k1", 4.0);

    // A2 4.5-9.5: ask the agent
    capIn("#c2", 4.5);
    hide("#ph", 4.6);
    tl.fromTo("#ub", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: E_IN, immediateRender: false }, 4.7);
    type("#ubt", 4.9, 16, 14);
    tl.fromTo("#ab", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: E_IN, immediateRender: false }, 6.6);
    for (let i = 0; i < 12; i++) tl.set("#cur", { opacity: i % 2 ? 1 : 0 }, 7.0 + i * 0.5);
    capOut("#c2", 9.2);

    // A3 9.5-17: plugins into the running app
    capIn("#c3", 9.6);
    hide("#empty", 9.6);
    build("#p1", 9.8, -300);
    show("#nTitle", 10.9);
    build("#p2", 10.9, -412);
    tl.to(["#r1", "#r2", "#r3"], { opacity: 1, duration: 0.3, stagger: 0.1 }, 12.0);
    build("#p3", 12.0, -524);
    show("#nSearch", 13.1);
    hide(["#abBuild", "#cur"], 13.3, 0.15); show("#abDone", 13.4, 0.2);
    hide("#runA", 13.5, 0.15); show("#runB", 13.6);
    capOut("#c3", 16.6);
    hide("#runB", 16.8, 0.15); show("#runA", 16.9);

    // A4 17-22: publish a plugin to GitHub
    capIn("#c4", 17.1);
    show("#k2", 17.1, 0.25); type("#k2t", 17.3, 18, 22); type("#k2u", 18.2, 20, 22);
    tl.set("#pub", { opacity: 1 }, 18.6);
    tl.to("#pub", { x: 860 - 1170, y: 134 - 730, duration: 0.9, ease: MOVE }, 18.7);
    show("#pubLbl", 19.6);
    capOut("#c4", 21.7); hide("#k2", 21.7);

    // A5 22-28: someone else pulls it
    tl.to("#card", { scale: 0.48, duration: 0.7, ease: MOVE }, 22.0);
    capIn("#c5", 22.3);
    tl.fromTo("#team", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.6, ease: E_IN, immediateRender: false }, 22.5);
    show("#k3", 22.4, 0.25); type("#k3t", 22.6, 30, 26); type("#k3u", 23.5, 22, 22);
    tl.set("#pull", { opacity: 1 }, 24.4);
    tl.to("#pull", { x: 1328 - 860, y: 480 - 134, scale: 0.667, duration: 0.85, ease: MOVE }, 24.5);
    tl.to(["#tr1", "#tr2", "#tr3"], { opacity: 1, duration: 0.3, stagger: 0.1 }, 25.4);
    capOut("#c5", 27.6); hide("#k3", 27.6);

    // A6 28-33: versions
    tl.to(["#team", "#pull"], { opacity: 0, x: "+=40", duration: 0.35, ease: "power2.in" }, 28.0);
    tl.to("#card", { scale: 1, duration: 0.7, ease: MOVE }, 28.1);
    capIn("#c6", 28.6);
    show("#ver", 28.9);
    tl.to("#verMark", { x: -220, duration: 0.45, ease: MOVE }, 30.0);
    tl.to("#p3", { opacity: 0, y: -24, duration: 0.3, ease: "power2.in" }, 30.2); hide("#nSearch", 30.2);
    tl.to("#verMark", { x: 0, duration: 0.45, ease: MOVE }, 31.2);
    tl.to("#p3", { opacity: 1, y: 0, duration: 0.4, ease: E_IN }, 31.4); show("#nSearch", 31.4);
    capOut("#c6", 32.6); hide("#ver", 32.7);

    // A7 33-39: one app, every surface (36.5 s is the poster)
    capIn("#c7", 33.1);
    show("#k4", 33.1, 0.25); type("#k4t", 33.3, 11, 22); type("#k4u", 33.9, 15, 22);
    tl.to("#card", { scale: 0.48, y: 40, duration: 0.7, ease: MOVE }, 33.1);
    show("#bbar", 33.6, 0.3);
