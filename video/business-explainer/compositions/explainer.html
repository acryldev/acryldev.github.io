    const tl = gsap.timeline({ paused: true });
    const E_IN = "expo.out", MOVE = "power3.inOut";

      tl.to(id, { opacity: 1, duration: 0.01 }, t);
      tl.to(`${id} .w`, { opacity: 1, filter: "blur(0px)", duration: 0.2, stagger: 0.07, ease: "power4.out" }, t);

    const capOut = (id, t) => tl.to(id, { opacity: 0, filter: "blur(8px)", duration: 0.22, ease: "power2.in" }, t);

    const hide = (id, t, d = 0.22) => tl.to(id, { opacity: 0, duration: d, ease: "power2.in" }, t);
    const rise = (id, t, d = 0.5) => tl.fromTo(id, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: d, ease: E_IN, immediateRender: false }, t);
    const type = (id, t, chars, cps = 18) => tl.to(id, { clipPath: "inset(0 0% 0 0)", duration: chars / cps, ease: `steps(${chars})` }, t);
    // A plugin is made, then snaps into its slot.
    const build = (id, t, dx, dy) => {
      tl.fromTo(id, { opacity: 0, scale: 0.3, x: dx, y: dy }, { opacity: 1, scale: 0.55, duration: 0.35, ease: E_IN, immediateRender: false }, t);

      tl.to(id, { scale: 1.08, duration: 0.1, ease: "power2.out" }, t + 1.0);
      tl.to(id, { scale: 1, duration: 0.3, ease: "back.out(2.5)" }, t + 1.1);
    };

    // P1 0-4: one customer, one small request
    show("#eb1", 0.2);
    capIn("#c1", 0.4);
    tl.fromTo("#form", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: E_IN, immediateRender: false }, 0.6);
    type("#fxt", 1.0, 36, 16);
    tl.to("#fbtn", { scale: 0.92, duration: 0.1, ease: "power2.out" }, 3.4);
    tl.to("#fbtn", { scale: 1, duration: 0.25, ease: "back.out(2.5)" }, 3.5);
    capOut("#c1", 3.9);

    // P2 4.2-8.4: it joins the queue
    capIn("#c2", 4.3);
    show("#road", 3.6, 0.4);
    tl.to("#form", { opacity: 0, y: 20, duration: 0.3, ease: "power2.in" }, 4.4);
    tl.fromTo("#tkMine", { opacity: 0, y: -380, scale: 6 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: MOVE, immediateRender: false }, 4.5);
    capOut("#c2", 8.1);

    // P3 8.4-12.4: months pass
    capIn("#c3", 8.5);
    tl.to("#card", { opacity: 0.45, duration: 0.5, ease: "power2.out" }, 8.6);
    tl.to("#rmark", { x: 700, duration: 3.4, ease: "none" }, 8.6);
    tl.to("#tk1", { opacity: 0, duration: 0.3 }, 9.3);
    tl.to(["#tk2", "#tk3", "#tk4", "#tk5", "#tk6", "#tk7", "#tkMine"], { x: -46, duration: 0.6, ease: MOVE }, 9.4);
    tl.to("#tk2", { opacity: 0, duration: 0.3 }, 10.9);
    tl.to(["#tk3", "#tk4", "#tk5", "#tk6", "#tk7", "#tkMine"], { x: -92, duration: 0.6, ease: MOVE }, 11.0);
    capOut("#c3", 12.2);

    // P4 12.4-16: so they build their own copy
    capIn("#c4", 12.5);
    tl.fromTo("#clone", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.7, ease: E_IN, immediateRender: false }, 12.6);
    tl.to("#card", { opacity: 0.18, duration: 0.6, ease: "power2.out" }, 13.2);
    capOut("#c4", 15.7);
    hide(["#clone", "#road", "#eb1"], 15.7, 0.25);
    tl.to("#card", { opacity: 0, filter: "blur(8px)", duration: 0.25, ease: "power2.in" }, 15.7);

    // T1 16-20: a prompt box in the product
    tl.set("#card", { filter: "blur(8px)" }, 15.96);
    tl.to("#card", { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, 16.1);
    show("#eb2", 16.1);
    capIn("#c5", 16.3);
    hide("#reqLink", 16.8);
    show("#inputBox", 17.2); 
    capOut("#c5", 19.7);

    // T2 20-26: they say it, the agent builds it
    capIn("#c6", 20.1);

    tl.to("#ub .w2", { opacity: 1, duration: 0.01, stagger: 0.14 }, 20.5);

    capIn("#c13", 50.1);
    show("#k1", 50.4, 0.25); type("#k1t", 50.6, 18, 14);
    rise("#layerBand", 50.4); rise("#foundBand", 50.7);
    tl.fromTo("#relBand", { opacity: 0, y: 200 }, { opacity: 1, y: 0, duration: 0.5, ease: E_IN, immediateRender: false }, 52.0);
    tl.to("#relBand", { y: -150, duration: 0.7, ease: MOVE }, 52.7);

    tl.to("#newStripe", { opacity: 1, duration: 0.3 }, 53.2);

    hide("#eb3", 54.0); show("#eb4", 54.1);
