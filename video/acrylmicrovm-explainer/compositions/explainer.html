    // A chip appears at (x0, y0), travels to (x1, y1) and fades there. Chips are centred on their point.
    const fly = (id, t, [x0, y0], [x1, y1], d = 0.9, stay = 0.3) => {

    fly("#bad", 18.1, [1450, 230], [1450, 470], 0.7, 0.0);
